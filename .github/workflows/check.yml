# Checks on every push and pull request, on the two supported OSes (SPEC: Windows and Linux).
# No headset here: byte-compile everything and run the unit tests in tests/.
# Runs on GitHub-hosted runners only (this repo is public; the pipeline repo's R29).
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q -x "build|dist" .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
