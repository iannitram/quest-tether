# Checks on every push and pull request, on the two supported OSes (SPEC: Windows and Linux).
# No headset here: byte-compile everything and run the unit tests in tests/.
# Runs on the self-hosted Hyperion runners (R29); the Windows runner uses its own Python 3.12.
name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: [self-hosted, windows]
          - os: linux
            runner: [self-hosted, linux]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows' || runner.environment == 'github-hosted'
        with:
          python-version: "3.11"
      - name: Byte-compile
        run: python -m compileall -q -x "build|dist" .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
